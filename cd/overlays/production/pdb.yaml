# ABOUTME: Keeps one developer-portal pod serving while Autopilot drains a node (upgrades, bin-packing)
# ABOUTME: Pairs with the 2 replicas and the zone spread set in this overlay's kustomization

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: developer-portal
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: developer-portal
